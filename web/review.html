<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人手覆核 — 地盤 AI 安全監測系統</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">地盤 AI 安全監測及自動記錄系統<small>AI Site Safety Monitoring and Automated Record System</small></div>
  <nav class="tabs">
    <a href="index.html">多地盤儀表板</a>
    <a href="review.html">人手覆核</a>
    <a href="reports.html">每日報告</a>
  </nav>
  <span class="detector-badge" id="detector-badge">載入中…</span>
</header>

<main>
  <div class="toolbar">
    <label class="field">地盤
      <select id="site-select"><option value="">全部</option></select>
    </label>
    <label class="field">工作日期
      <select id="date-select"><option value="">全部</option></select>
    </label>
    <label class="field">覆核人
      <input type="text" id="reviewer" placeholder="輸入姓名" size="12">
    </label>
    <label class="field">
      <input type="checkbox" id="show-reviewed"> 顯示已覆核
    </label>
    <div class="spacer"></div>
    <span id="queue-count" class="tag muted">—</span>
    <button id="btn-refresh">重新整理</button>
  </div>
  <p class="hint">
    AI 只作初步篩查，每一項標示均須由管工或安全主任確認或推翻；日報只採用「確認違規」的項目。
  </p>

  <div class="grid-review" id="queue"></div>
</main>

<div id="toast"></div>
<script src="api.js"></script>
<script>
const REVIEWER_KEY = "citf-reviewer";
const reviewerInput = document.getElementById("reviewer");
reviewerInput.value = localStorage.getItem(REVIEWER_KEY) || "";
reviewerInput.addEventListener("change", () =>
  localStorage.setItem(REVIEWER_KEY, reviewerInput.value.trim())
);

async function loadFilters() {
  const [sites, { dates }] = await Promise.all([API.get("/api/sites"), API.get("/api/dates")]);
  document.getElementById("site-select").insertAdjacentHTML(
    "beforeend",
    sites.map((s) => `<option value="${s.id}">${s.code} — ${s.name}</option>`).join("")
  );
  document.getElementById("date-select").insertAdjacentHTML(
    "beforeend",
    dates.map((d) => `<option value="${d}">${d}</option>`).join("")
  );
}

function queryString() {
  const params = new URLSearchParams();
  const siteId = document.getElementById("site-select").value;
  const date = document.getElementById("date-select").value;
  if (siteId) params.set("site_id", siteId);
  if (date) params.set("date", date);
  params.set("pending_only", document.getElementById("show-reviewed").checked ? "false" : "true");
  return params.toString();
}

function cardMarkup(item) {
  const decided = item.reviewed;
  const status = decided
    ? `<span class="tag ${item.decision === "confirmed" ? "danger" : "muted"}">
         ${item.decision === "confirmed" ? "已確認違規" : "已判定誤報"} · ${item.reviewer}
       </span>`
    : `<span class="tag warn">待覆核</span>`;

  return `<article class="review-card ${decided ? "done" : ""}" data-id="${item.detection_id}">
    <img src="/api/photos/${item.photo_id}/file" alt="${item.original_name}"
         loading="lazy" onclick="openLightbox(this.src)">
    <div class="body">
      <div class="title">${item.label}</div>
      <div class="meta">
        ${item.site_code} ${item.site_name} · ${item.work_date}<br>
        AI 信心值 ${item.confidence.toFixed(2)} · ${item.detector}<br>
        ${item.original_name} · ${formatTime(item.captured_at || item.received_at)}
      </div>
      <div style="margin-top:8px">${status}</div>
      <textarea placeholder="覆核備註（選填）">${item.note || ""}</textarea>
    </div>
    <div class="actions">
      <button class="danger" data-decision="confirmed">確認違規</button>
      <button data-decision="rejected">誤報</button>
    </div>
  </article>`;
}

async function submit(card, decision) {
  const reviewer = reviewerInput.value.trim();
  if (!reviewer) {
    toast("請先填寫覆核人姓名", true);
    reviewerInput.focus();
    return;
  }
  const detectionId = Number(card.dataset.id);
  const note = card.querySelector("textarea").value;
  await API.post(`/api/review/${detectionId}`, { reviewer, decision, note });
  toast(decision === "confirmed" ? "已記錄：確認違規" : "已記錄：誤報");
  await load();
}

async function load() {
  const items = await API.get(`/api/review/queue?${queryString()}`);
  const host = document.getElementById("queue");
  document.getElementById("queue-count").textContent = `${items.length} 項`;

  if (!items.length) {
    host.innerHTML = "<div class='panel'><div class='empty'>沒有待覆核項目。</div></div>";
    return;
  }
  host.innerHTML = items.map(cardMarkup).join("");
  host.querySelectorAll(".review-card").forEach((card) => {
    card.querySelectorAll("button[data-decision]").forEach((button) => {
      button.addEventListener("click", () =>
        withBusy(button, () => submit(card, button.dataset.decision))
      );
    });
  });
}

["site-select", "date-select", "show-reviewed"].forEach((id) =>
  document.getElementById(id).addEventListener("change", load)
);
document.getElementById("btn-refresh").addEventListener("click", (event) =>
  withBusy(event.target, load)
);

(async function init() {
  await loadFilters();
  await load();
})();
</script>
</body>
</html>
