<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日報告 — 地盤 AI 安全監測系統</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">地盤 AI 安全監測及自動記錄系統<small>AI Site Safety Monitoring and Automated Record System</small></div>
  <nav class="tabs">
    <a href="index.html">多地盤儀表板</a>
    <a href="review.html">人手覆核</a>
    <a href="reports.html">每日報告</a>
  </nav>
  <span class="detector-badge" id="detector-badge">載入中…</span>
</header>

<main>
  <div class="toolbar">
    <label class="field">地盤
      <select id="site-select"></select>
    </label>
    <label class="field">工作日期
      <select id="date-select"></select>
    </label>
    <label class="field">生成人
      <input type="text" id="generated-by" placeholder="選填" size="12">
    </label>
    <button id="btn-preview">線上預覽</button>
    <button id="btn-generate" class="primary">生成日報</button>
    <div class="spacer"></div>
    <button id="btn-refresh">重新整理</button>
  </div>
  <p class="hint">
    日報以覆核結果為準：AI 標示但未覆核的項目會另列「尚待覆核」，不計入確認違規。重覆生成會覆寫同日同地盤的報告。
    線上預覽即時反映最新覆核結果，毋須先生成 .docx，可在預覽頁直接列印或另存 PDF。
  </p>

  <section class="panel">
    <h2>已生成報告</h2>
    <table>
      <thead>
        <tr>
          <th>工作日期</th>
          <th>地盤</th>
          <th class="num">相片</th>
          <th class="num">確認違規</th>
          <th>生成時間</th>
          <th>生成人</th>
          <th>查看</th>
        </tr>
      </thead>
      <tbody id="report-rows"></tbody>
    </table>
  </section>
</main>

<div id="toast"></div>
<script src="api.js"></script>
<script>
async function loadFilters() {
  const [sites, { dates }] = await Promise.all([API.get("/api/sites"), API.get("/api/dates")]);
  document.getElementById("site-select").innerHTML = sites
    .map((s) => `<option value="${s.id}">${s.code} — ${s.name}</option>`)
    .join("");
  document.getElementById("date-select").innerHTML = dates.length
    ? dates.map((d) => `<option value="${d}">${d}</option>`).join("")
    : "<option value=''>尚無資料</option>";
}

async function loadReports() {
  const reports = await API.get("/api/reports");
  const tbody = document.getElementById("report-rows");
  if (!reports.length) {
    tbody.innerHTML = "<tr><td colspan='7' class='empty'>尚未生成任何報告</td></tr>";
    return;
  }
  tbody.innerHTML = reports
    .map(
      (r) => `<tr>
        <td>${r.work_date}</td>
        <td><strong>${r.site_code}</strong> ${r.site_name}</td>
        <td class="num">${r.photo_count}</td>
        <td class="num">${r.violation_count ? `<span class="tag danger">${r.violation_count}</span>` : 0}</td>
        <td>${formatTime(r.generated_at)}</td>
        <td>${r.generated_by || "系統"}</td>
        <td>
          <a href="/api/reports/${r.id}/preview" target="_blank" rel="noopener">線上預覽</a>
          ·
          <a href="/api/reports/${r.id}/download">下載 .docx</a>
        </td>
      </tr>`
    )
    .join("");
}

document.getElementById("btn-preview").addEventListener("click", () => {
  const workDate = document.getElementById("date-select").value;
  if (!workDate) {
    toast("尚無可預覽的日期", true);
    return;
  }
  const siteId = document.getElementById("site-select").value;
  window.open(`/api/reports/preview?site_id=${siteId}&date=${workDate}`, "_blank", "noopener");
});

document.getElementById("btn-generate").addEventListener("click", (event) =>
  withBusy(event.target, async () => {
    const workDate = document.getElementById("date-select").value;
    if (!workDate) throw new Error("尚無可生成報告的日期");
    const result = await API.post("/api/reports/generate", {
      site_id: Number(document.getElementById("site-select").value),
      work_date: workDate,
      generated_by: document.getElementById("generated-by").value.trim(),
    });
    toast(`已生成 ${result.site_name} ${result.work_date} 日報（確認違規 ${result.confirmed} 項）`);
    await loadReports();
  })
);

document.getElementById("btn-refresh").addEventListener("click", (event) =>
  withBusy(event.target, loadReports)
);

(async function init() {
  await loadFilters();
  await loadReports();
})();
</script>
</body>
</html>
